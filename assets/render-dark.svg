<svg xmlns="http://www.w3.org/2000/svg" width="564" height="583" viewBox="0 0 564 583"><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1b222c"/></pattern><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a212c"/><stop offset="1" stop-color="#151b24"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F74E8"/><stop offset="1" stop-color="#4C8DF6"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/></filter><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#3d4b60"/></marker></defs><rect width="564" height="583" rx="18" fill="#0d1117"/><rect width="564" height="583" rx="18" fill="url(#dots)"/><path d="M155 165 V187 Q155 197 165 197 H272 Q282 197 282 207 V227" fill="none" stroke="#3d4b60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><circle cx="155" cy="165" r="3.5" fill="#3d4b60"/><path d="M409 165 V187 Q409 197 399 197 H292 Q282 197 282 207 V227" fill="none" stroke="#3d4b60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><circle cx="409" cy="165" r="3.5" fill="#3d4b60"/><path d="M282 354 V376 Q282 386 272 386 H165 Q155 386 155 396 V416" fill="none" stroke="#3d4b60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><circle cx="282" cy="354" r="3.5" fill="#3d4b60"/><path d="M282 354 V376 Q282 386 292 386 H399 Q409 386 409 396 V416" fill="none" stroke="#3d4b60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><circle cx="282" cy="354" r="3.5" fill="#3d4b60"/><rect x="40" y="40" width="230" height="125" rx="12" fill="url(#card)" stroke="#2b3442" filter="url(#shadow)"/><text x="60" y="70" font-family="Inter, -apple-system, Segoe UI, Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6f7a8c">SCENE.URA</text><text x="60" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#e8eef6">Scene</text><text x="60" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#97a2b3">spheres, planes,</text><text x="60" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#97a2b3">cones, a light</text><rect x="294" y="40" width="230" height="125" rx="12" fill="url(#card)" stroke="#2b3442" filter="url(#shadow)"/><text x="314" y="70" font-family="Inter, -apple-system, Segoe UI, Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6f7a8c">CAMERA.URA</text><text x="314" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#e8eef6">Camera</text><text x="314" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#97a2b3">ray_for(x, y)</text><text x="314" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#97a2b3">one ray per pixel</text><rect x="122" y="229" width="320" height="125" rx="12" fill="url(#accent)" stroke="none" filter="url(#shadow)"/><text x="142" y="259" font-family="Inter, -apple-system, Segoe UI, Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#bcd3fb">TRACE.URA</text><text x="142" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#ffffff">trace(ray)</text><text x="142" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#dbe7fd">closest hit, then bounce:</text><text x="142" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#dbe7fd">diffuse, mirror, glass</text><rect x="40" y="418" width="230" height="125" rx="12" fill="url(#card)" stroke="#2b3442" filter="url(#shadow)"/><text x="60" y="448" font-family="Inter, -apple-system, Segoe UI, Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6f7a8c">MAIN.URA</text><text x="60" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#e8eef6">SDL window</text><text x="60" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#97a2b3">samples add up</text><text x="60" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#97a2b3">every frame</text><rect x="294" y="418" width="230" height="125" rx="12" fill="url(#card)" stroke="#2b3442" filter="url(#shadow)"/><text x="314" y="448" font-family="Inter, -apple-system, Segoe UI, Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6f7a8c">RECORD.URA</text><text x="314" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#e8eef6">frames</text><text x="314" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#97a2b3">PPM files, then</text><text x="314" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#97a2b3">ffmpeg: gif / mp4</text></svg>